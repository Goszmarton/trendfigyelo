name: Napi trendgyűjtés

on:
  workflow_dispatch:
    inputs:
      plafon_override:
        description: "Hívás-plafon override (CSAK csökkent; pl. 0 = az L4 szelep piros-út igazolása, 0 valódi hívás). Üresen normál."
        required: false
        default: ""
  # Napi gyűjtés. Az ELSŐDLEGES, időben-induló út a szerver-trigger (Hetzner-cron →
  # workflow_dispatch, 19:10 UTC) — a GitHub ingatag best-effort ütemezése helyett
  # garantált indítás. A GitHub saját schedule-cronjai a BACKUP: a szerver MÖGÉ időzítve
  # (20:30 + 23:00 UTC), így az idempotencia-őr (lásd lentebb) dedup-olja őket, ha a
  # szerver már gyűjtött ma. A GitHub-cron sosem tüzel korábban a tervezettnél (csak
  # késhet), ezért a szerver mindig előbb ér ide → legfeljebb EGY gyűjt ténylegesen.
  schedule:
    - cron: "30 20 * * *"   # 20:30 UTC — backup (22:30 nyár / 21:30 tél Budapest), ha a szerver-trigger kimaradt
    - cron: "0 23 * * *"    # 23:00 UTC — késői backup (01:00 nyár / 00:00 tél Budapest)

permissions:
  contents: write

concurrency:
  group: napi-futtatas
  cancel-in-progress: false

jobs:
  gyujtes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Idempotencia-őr (ütemezett fallback: ma már gyűjtöttünk?)"
        id: guard
        shell: bash
        run: |
          # Kézi (workflow_dispatch) futás MINDIG gyűjt — a felhasználó szándéka felülír.
          # Ütemezett futásnál: ha a legfrissebb adat 'frissitve' dátuma a mai UTC-nap,
          # ma már megvan az adat → a fallback slot némán kihagyja a gyűjtést (skip=true).
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Kézi (workflow_dispatch) futás — az őr nem aktív, gyűjtünk."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          skip="$(python -m trendfigyelo.futas_orzo docs/data/legfrissebb.json)"
          echo "Ütemezett futás — ma már gyűjtöttünk? skip=$skip"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Függőségek telepítése
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Trendfigyelő futtatása
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          # a plafon-override CSAK a workflow_dispatch triggeren létezik; a cron (schedule) ág
          # MINDIG üres stringet kap → a _plafon_override_env némán None-t ad (nincs override).
          PLAFON_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.plafon_override || '' }}
        run: |
          set -o pipefail   # a python nem-nulla exitje (pl. L4 plafon = 2) NE vesszen el a `| tee` mögött
          python top_keresesek.py 2>&1 | tee run.log

      - name: Változások commitolása (csak JSON + napló)
        if: always() && steps.guard.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data adatok/naplo.csv
          if git diff --staged --quiet; then
            echo "Nincs változás — nincs commit."
          else
            git commit -m "adat: napi HU trendgyűjtés ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

      - name: Artefakt feltöltése (napló + JSON + stdout)
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trendfutas-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            adatok/naplo.csv
            docs/data/**
            run.log
