name: Napi trendgyűjtés

on:
  workflow_dispatch:
    inputs:
      plafon_override:
        description: "Hívás-plafon override (CSAK csökkent; pl. 0 = az L4 szelep piros-út igazolása, 0 valódi hívás). Üresen normál."
        required: false
        default: ""
  # Napi ütemezett futás. A kézi (workflow_dispatch) futások igazolták, hogy a
  # felhő-runner IP-je nem kap azonnali 429-et a cél-idősávban (Task 9 élesítve):
  schedule:
    - cron: "7 19 * * *"   # 19:07 UTC — 21:07 nyár / 20:07 tél budapesti idő

permissions:
  contents: write

concurrency:
  group: napi-futtatas
  cancel-in-progress: false

jobs:
  gyujtes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Függőségek telepítése
        run: pip install -r requirements.txt

      - name: Trendfigyelő futtatása
        shell: bash
        env:
          # a plafon-override CSAK a workflow_dispatch triggeren létezik; a cron (schedule) ág
          # MINDIG üres stringet kap → a _plafon_override_env némán None-t ad (nincs override).
          PLAFON_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.plafon_override || '' }}
        run: |
          set -o pipefail   # a python nem-nulla exitje (pl. L4 plafon = 2) NE vesszen el a `| tee` mögött
          python top_keresesek.py 2>&1 | tee run.log

      - name: Változások commitolása (csak JSON + napló)
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data adatok/naplo.csv
          if git diff --staged --quiet; then
            echo "Nincs változás — nincs commit."
          else
            git commit -m "adat: napi HU trendgyűjtés ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

      - name: Artefakt feltöltése (napló + JSON + stdout)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendfutas-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            adatok/naplo.csv
            docs/data/**
            run.log
