name: YouTube-gyűjtés (napi)
on:
  workflow_dispatch:
  # A szerver-trigger (Hetzner-cron → workflow_dispatch, 15:00 UTC) az ELSŐDLEGES,
  # időben-induló út. A GitHub saját ütemezése a BACKUP: a szerver MÖGÉ időzítve
  # (16:30 UTC), így az idempotencia-őr (lásd lentebb) dedup-olja, ha a szerver már
  # gyűjtött ma — a GitHub-cron pedig sosem tüzel korábban a tervezettnél, csak késhet,
  # ezért a szerver mindig előbb ér ide. A dispatch (kézi/szerver) MINDIG gyűjt.
  schedule:
    - cron: "30 16 * * *"   # 16:30 UTC — backup (18:30 nyár / 17:30 tél Budapest), a Google-futás ELŐTT
permissions:
  contents: write
concurrency:
  group: youtube-futtatas
  cancel-in-progress: false
jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Idempotencia-őr (ütemezett backup: ma már gyűjtöttünk youtube-ot?)"
        id: guard
        shell: bash
        run: |
          # Kézi/szerver (workflow_dispatch) futás MINDIG gyűjt — a felhasználó/trigger szándéka felülír.
          # Ütemezett futásnál: ha a youtube_nyers.json legfrissebb 'lekerdezes_utc' dátuma a mai UTC-nap,
          # ma már megvan a youtube-adat → a backup slot némán kihagyja a gyűjtést (skip=true).
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Kézi/szerver (workflow_dispatch) futás — az őr nem aktív, gyűjtünk."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          skip="$(python -m trendfigyelo.futas_orzo --youtube docs/data/youtube_nyers.json)"
          echo "Ütemezett futás — ma már gyűjtöttünk youtube-ot? skip=$skip"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Függőségek
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: YouTube-gyűjtés
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -o pipefail
          python -m trendfigyelo.youtube 2>&1 | tee youtube.log

      - name: Commit (külön adat-commit)
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/youtube_nyers.json docs/data/youtube_regresszio.json adatok/naplo.csv
          if git diff --cached --quiet; then
            echo "Nincs változás — nincs commit."
          else
            git commit -m "adat: napi YouTube-gyűjtés ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
