<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trendfigyelő</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <nav id="fomenu" aria-label="Fő menü">
    <a href="index.html" class="fomenu-home">Áttekintő</a>
    <div class="fomenu-csoport" aria-label="Elemzések">
      <span class="fomenu-cimke">Elemzések</span>
      <a href="elemzes.html">Napi</a>
      <a href="heti.html">Heti</a>
      <a href="havi.html">Havi</a>
    </div>
    <a href="bovites.html" class="fomenu-onallo">Radar</a>
    <div class="fomenu-csoport" aria-label="Statisztikák">
      <span class="fomenu-cimke">Statisztikák</span>
      <a href="trendek.html">Google</a>
      <a href="youtube.html" class="aktiv" aria-current="page">YouTube</a>
    </div>
    <a href="adatokrol.html" class="fomenu-onallo">Infó</a>
  </nav>
  <header class="fejlec-doboz">
    <h1>YouTube Trendek – mit néznek Magyarországon?</h1>
    <p class="halvany">Magyarországi (geo=HU) YouTube-keresési trendek, napi frissítéssel.</p>
  </header>
  <main>
    <!-- KIEMELT összefoglaló: trend-irány + közvetlenül alatta a mai eltérés a trendtől, egy kártyában -->
    <div class="attekinto-kiemelt">
      <section id="youtube-attekinto" class="attekinto-panel" data-mod="trend" aria-label="A kulcsszavak trendje">
        <h2>A kulcsszavak trendje</h2>
      </section>
      <section id="youtube-attekinto-elteres" class="attekinto-panel" data-mod="elteres" aria-label="Mai eltérés a kulcsszavak trendjétől">
        <h2>Mai eltérés a kulcsszavak trendjétől</h2>
      </section>
    </div>
    <section class="szekcio">
      <div class="vezerlo-sav"><span class="vezerlo-cim">Idő-ablak</span>
        <div id="youtube-intervallum-vezerlo"></div></div>
      <div id="youtube-blokk" data-aktiv-intervallum="teljes"></div>
    </section>
  </main>
  <footer id="labresz"></footer>
  <script src="vendor/chartjs/chart.umd.js"></script>
  <script src="js/app.js"></script>
  <script src="js/youtube.js"></script>
</body>
</html>
