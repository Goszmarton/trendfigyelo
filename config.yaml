# Trendfigyelő — az EGYETLEN konfigforrás. geo/időablak/nyelv/kulcsszavak.
geo: HU
nyelv: hu
idoablak_orak: 24            # felkapott trendek: hours=24
idosor_idokeret: "now 1-d"   # interest_over_time timeframe (elmúlt 24 óra)
kerespont:                   # anti-block (IP-blokkolás elleni) paraméterek
  alap_keses_mp: 6.0         # trendspy request_delay (2. füst-teszt: azonnali 429 → lassítás 3→6)
  szoras_mp: [6, 10]         # véletlen 6–10 mp két hívás közt (2. füst-teszt: lassítás [3,7]→[6,10])
  max_probak: 4              # 429 esetén max ennyi próba, utána az ág feladva
  backoff_mp: [30, 120, 480] # exponenciális visszavárakozás (mp)
trend_idosor_max: 15         # hány top trend kapjon idősort (sparkline)
kulcsszo_idokeret: "now 7-d"   # kulcsszó-idősorok: 7 napos ablak, órás felbontás (szóló lekérdezés)
naplo_max_sor: 2000            # a naplo.csv görgő sor-cap-je (~500 nap napi ~4 sornál)
tortenet_visszapotlas_nap: 3   # a kulcsszó-tortenet utolsó N teljes napjának upsertje (429-önjavítás)
modszertan_valtas: 2026-07-30  # módszertani töréspont: az első éles szóló-mérés napja (horgonyos→szóló; CSAK jelöl)
proxy: null                  # pl. "http://user:pass@host:port" — valódi hitelesítőt NE commitolj (publikus repo!); alap: nincs
# Phase 2.5: szóló lekérdezés kulcsszavanként (horgony elvetve). Minden szó a saját 0–100 tartományát kapja.
# tipus ∈ {szintmero, esemenyjelzo, hibrid}; a domének ékezet nélküliek (a magyar címke a frontendé).
kulcsszavak:
  - {kifejezes: "állás",        domen: munkaeropiac,       tipus: szintmero}
  - {kifejezes: "kormányablak", domen: kozigazgatas,       tipus: szintmero}
  - {kifejezes: "eladó lakás",  domen: lakhatas,           tipus: szintmero}
  - {kifejezes: "albérlet",     domen: lakhatas,           tipus: szintmero}
  - {kifejezes: "akciós újság", domen: fogyasztas,         tipus: szintmero}
  - {kifejezes: "benzin",       domen: fogyasztas,         tipus: szintmero}
  - {kifejezes: "nyaralás",     domen: fogyasztas,         tipus: szintmero}
  - {kifejezes: "kórház",       domen: egeszseg,           tipus: szintmero}
  - {kifejezes: "betegség",     domen: egeszseg,           tipus: szintmero}
  - {kifejezes: "napelem",      domen: energia,            tipus: hibrid}
  - {kifejezes: "nyugdíj",      domen: jovedelem,          tipus: hibrid}
  - {kifejezes: "hitel",        domen: haztartasi_penzugy, tipus: szintmero}
  - {kifejezes: "tüntetés",     domen: kozelet,            tipus: esemenyjelzo}
