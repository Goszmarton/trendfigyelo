  - {kifejezes: "korrupció",      domen: politika,    tipus: szintmero,    racs: het, oras: true,  futas: reggel}
  - {kifejezes: "kormány",        domen: politika,    tipus: szintmero,    racs: het, oras: true,  futas: reggel}

