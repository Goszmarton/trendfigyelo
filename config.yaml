# Trendfigyelő — az EGYETLEN konfigforrás. geo/időablak/nyelv/kulcsszavak.
geo: HU
nyelv: hu
idoablak_orak: 24            # felkapott trendek: hours=24
idosor_idokeret: "now 1-d"   # interest_over_time timeframe (elmúlt 24 óra)
kerespont:                   # anti-block (IP-blokkolás elleni) paraméterek
  alap_keses_mp: 6.0         # trendspy request_delay (2. füst-teszt: azonnali 429 → lassítás 3→6)
  szoras_mp: [6, 10]         # véletlen 6–10 mp két hívás közt (2. füst-teszt: lassítás [3,7]→[6,10])
  max_probak: 4              # 429 esetén max ennyi próba, utána az ág feladva
  backoff_mp: [30, 120, 480] # exponenciális visszavárakozás (mp)
trend_idosor_max: 15         # hány top trend kapjon idősort (sparkline)
trend_idosor_rekesz_max: 5   # GORBE-B: hány holtverseny-rekesz trend kapjon idősort (forward-only, LEGUTOLSÓ ág); NEM-MÉRT, 14-nap újramérés
kulcsszo_idokeret: "now 7-d"   # kulcsszó-idősorok: 7 napos ablak, órás felbontás (szóló lekérdezés)
naplo_max_sor: 2000            # a naplo.csv görgő sor-cap-je (~500 nap napi ~4 sornál)
tortenet_visszapotlas_nap: 3   # a kulcsszó-tortenet utolsó N teljes napjának upsertje (429-önjavítás)
modszertan_valtas: 2026-07-30  # módszertani töréspont: az első éles szóló-mérés napja (horgonyos→szóló; CSAK jelöl)
proxy: null                  # pl. "http://user:pass@host:port" — valódi hitelesítőt NE commitolj (publikus repo!); alap: nincs
# Phase 2.5: szóló lekérdezés kulcsszavanként (horgony elvetve). Minden szó a saját 0–100 tartományát kapja.
# tipus ∈ {szintmero, esemenyjelzo, hibrid}; a domének ékezet nélküliek (a magyar címke a frontendé).
# racs ∈ {ora, nap, het} — a megjelenítés/trend felbontása (Phase 4, MÉRT 2026-08-13); hiány → "ora".
# A gyűjtés 1. (órás, now 7-d) lekérdezése MINDEN szóra változatlan; a racs a másodlagos nap/het sorozatot vezérli.
kulcsszavak:
  - {kifejezes: "állás",        domen: munkaeropiac,       tipus: szintmero,    racs: het}
  - {kifejezes: "kormányablak", domen: kozigazgatas,       tipus: szintmero,    racs: het}
  - {kifejezes: "eladó lakás",  domen: lakhatas,           tipus: szintmero,    racs: nap}
  - {kifejezes: "albérlet",     domen: lakhatas,           tipus: szintmero,    racs: nap}
  - {kifejezes: "akciós újság", domen: fogyasztas,         tipus: szintmero,    racs: het}
  - {kifejezes: "benzin",       domen: fogyasztas,         tipus: szintmero,    racs: ora}
  - {kifejezes: "nyaralás",     domen: fogyasztas,         tipus: szintmero,    racs: nap}
  - {kifejezes: "kórház",       domen: egeszseg,           tipus: szintmero,    racs: het}
  - {kifejezes: "betegség",     domen: egeszseg,           tipus: szintmero,    racs: nap}
  - {kifejezes: "napelem",      domen: energia,            tipus: hibrid,       racs: nap}
  - {kifejezes: "nyugdíj",      domen: jovedelem,          tipus: hibrid,       racs: ora}
  - {kifejezes: "hitel",        domen: haztartasi_penzugy, tipus: szintmero,    racs: nap}
  - {kifejezes: "tüntetés",     domen: kozelet,            tipus: esemenyjelzo, racs: het}

# YouTube-fül (Phase 4, 2026-08-25): társadalmi videó-igény-monitor, gprop=youtube, geo=HU.
# A racs a MEGJELENÍTÉSI alapértelmezés (napi/heti); a gyűjtés MINDKÉT timeframe-et (3-m + 12-m) bekéri.
# tipus mindenhol szintmero (a trend minden szóra számolódik). A domének ékezet nélküliek.
youtube:
  - {kifejezes: "szorongás",    domen: egeszseg,  tipus: szintmero, racs: het}
  - {kifejezes: "edzés",        domen: egeszseg,  tipus: szintmero, racs: nap}
